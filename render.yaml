services:
  - type: keyvalue
    name: cellusys-cache
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: cellusys-codecamp
    runtime: python
    plan: free
    region: frankfurt
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.9"
      - key: REDIS_URL
        fromService:
          name: cellusys-cache
          type: keyvalue
          property: connectionString
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      # Resend HTTPS email API (avoids the SMTP block on Free instances).
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Render Free has no free background-worker instances, so the Celery
      # worker + beat run inside this web service (see start.sh). Reminders
      # resume whenever the service is awake.
      - key: RUN_CELERY_IN_WEB
        value: "true"

